<!doctype html><html><head><meta charset="utf-8"><title>swcheck</title></head>
<body style="font:16px system-ui;padding:24px"><pre id="o">registering...</pre>
<script>
var o = document.getElementById('o');
if (!navigator.serviceWorker) { o.textContent = 'NO_SW_API (insecure context?)'; }
else navigator.serviceWorker.register('./swcheck.js', { scope: './' })
  .then(function (r) { o.textContent = 'REGISTERED, scope=' + r.scope + '\nwaiting to control...'; return navigator.serviceWorker.ready; })
  .then(function () { return fetch('./swprobe?x=' + Date.now()); })
  .then(function (res) { return res.text(); })
  .then(function (t) { o.textContent = 'RESULT: ' + t + '\n\n==> a service worker CAN run on jsDelivr here.'; })
  .catch(function (e) { o.textContent = 'FAILED: ' + e + '\n\n==> jsDelivr will not host the worker; needs a root origin.'; });
</script></body></html>
